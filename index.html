<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghosty</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main>
      <h1>👻 Ghost Talk</h1>
      <p>Type a word and see how a ghost would say it.</p>
      <label for="human">You say</label>
      <textarea id="human"></textarea>
      <p class="label">The ghost says</p>
      <p id="ghost" aria-live="polite"></p>
    </main>

    <script type="module" src="assets/js/ghosttalk.js" defer></script>
  </body>
</html>
